st.insertAdjacentHTML('beforeend','<p class="mut">Ультра: полное разрешение, тени объёма (AO), облака, дальний туман. Низкая отключает AO и облака.</p>');
/* ---------- игра ---------- */
const P={x:0,y:40,z:0,vx:0,vy:0,vz:0,yaw:0,pitch:0,fly:false,ground:false},W_=.3,H_=1.8,EYE=1.62,keys={};let state='menu',locked=false,sp={x:0,z:0,h:30},ang=0;
const HB=[1,2,3,4,5,6,9,8];let sel=0;
HB.forEach((b,i)=>{const d=document.createElement('div');d.className='slot'+(i?'':' on');d.style.backgroundImage=`url(${atlas.toDataURL()})`;d.style.backgroundPosition=`-${TL[b][1]*36}px 0`;$('#hb').appendChild(d)});
const selSlot=i=>{sel=(i+HB.length)%HB.length;[...$('#hb').children].forEach((e,j)=>e.classList.toggle('on',j===sel))};
function setSeed(s){SEED=s;for(let i=0;i<90;i++){const x=i*8,z=i*3;if(height(x,z)>WL+2){sp={x,z,h:height(x,z)};return}}sp={x:0,z:0,h:height(0,0)}}
const solid=(x,y,z)=>{const b=getB(Math.floor(x),Math.floor(y),Math.floor(z));return b&&b!==7};
const col=()=>{for(const i of[-W_,W_])for(const k of[-W_,W_])for(let j=0;j<=H_;j+=.9)if(solid(P.x+i,P.y+j,P.z+k))return true;return false};
function update(dt){const f=k=>keys[k]?1:0;let mx=f('KeyD')-f('KeyA'),mz=f('KeyS')-f('KeyW');const l=Math.hypot(mx,mz)||1;mx/=l;mz/=l;
 const spd=P.fly?11:keys.ShiftLeft?5.8:4.3,c=Math.cos(P.yaw),s=Math.sin(P.yaw);P.vx=(mx*c+mz*s)*spd;P.vz=(-mx*s+mz*c)*spd;
 const inW=getB(Math.floor(P.x),Math.floor(P.y+.5),Math.floor(P.z))===7;
 if(P.fly)P.vy=(f('Space')-f('ShiftLeft'))*9;else{P.vy=Math.max(P.vy-28*dt,-20);if(inW){P.vy=Math.max(P.vy,-3);if(keys.Space)P.vy=3.6}else if(keys.Space&&P.ground)P.vy=8.6}
 const mv=(a,d)=>{P[a]+=d;if(col()){P[a]-=d;return true}return false};
 if(mv('x',P.vx*dt))P.vx=0;if(mv('z',P.vz*dt))P.vz=0;if(mv('y',P.vy*dt)){P.ground=P.vy<0;P.vy=0}else P.ground=false;
 if(P.y<-20){P.x=sp.x+.5;P.z=sp.z+.5;P.y=sp.h+3}}
function ray(){const dx=-Math.sin(P.yaw)*Math.cos(P.pitch),dy=Math.sin(P.pitch),dz=-Math.cos(P.yaw)*Math.cos(P.pitch);let prev=null;
 for(let t=0;t<6;t+=.04){const x=Math.floor(P.x+dx*t),y=Math.floor(P.y+EYE+dy*t),z=Math.floor(P.z+dz*t),b=getB(x,y,z);if(b&&b!==7)return{h:[x,y,z],p:prev};prev=[x,y,z]}return null}
function startGame(){setSeed(seedNum($('#seed').value));resetWorld();edits.clear();P.x=sp.x+.5;P.z=sp.z+.5;P.y=sp.h+3;P.vy=0;P.fly=false;P.yaw=0;P.pitch=-.2;
 $('#c').requestPointerLock();state='play';$('#menu').style.display='none';$('#hud').style.display='block';
 for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)gen((sp.x>>4)+dx,(sp.z>>4)+dz)}
function toMenu(){state='menu';$('#pause').style.display='none';$('#hud').style.display='none';$('#menu').style.display='flex';hl.visible=false;if(document.pointerLockElement)document.exitPointerLock();setSeed(seedNum('Multicraft-Menu'));resetWorld();edits.clear()}
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4500)};
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===$('#c');$('#pause').style.display=state==='play'&&!locked?'flex':'none'});
document.addEventListener('pointerlockerror',()=>toast('Не удалось захватить мышь. Откройте игру в отдельной вкладке.'));
addEventListener('mousemove',e=>{if(!locked)return;P.yaw-=e.movementX*.0022*S.sens;P.pitch=Math.max(-1.55,Math.min(1.55,P.pitch-e.movementY*.0022*S.sens))});
addEventListener('keydown',e=>{keys[e.code]=true;if(state!=='play')return;if(e.code==='Space')e.preventDefault();if(e.code==='KeyF')P.fly=!P.fly;if(/^Digit[1-8]$/.test(e.code))selSlot(+e.code[5]-1)});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('wheel',e=>{if(locked)selSlot(sel+(e.deltaY>0?1:-1))});
addEventListener('contextmenu',e=>e.preventDefault());
$('#c').addEventListener('mousedown',e=>{if(!locked||state!=='play')return;const r=ray();if(!r)return;
 if(e.button===0)setB(...r.h,0);else if(e.button===2&&r.p){setB(...r.p,HB[sel]);if(col())setB(...r.p,0)}});
$('#resume').onclick=()=>$('#c').requestPointerLock();$('#quit').onclick=toMenu;
/* ---------- меню ---------- */
document.querySelectorAll('.tabs .btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs .btn').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===b.dataset.t))});
$('#seed').value=randSeed();$('#seed').oninput=preview;
$('#rnd').onclick=()=>{$('#seed').value=randSeed();preview()};
$('#smart').onclick=()=>{let best=null,bs=-9;for(let i=0;i<20;i++){const s=randSeed(),v=score(s);if(v>bs){bs=v;best=s}}$('#seed').value=best;preview()};
$('#play').onclick=startGame;
/* ---------- цикл ---------- */
let last=0,fc=0,ft=0;
function loop(t){requestAnimationFrame(loop);const lim=S.fps>=240?0:1000/S.fps;if(lim&&t-last<lim-2)return;const dt=Math.min((t-last)/1000,.05)||.016;last=t;
 fc++;if(t-ft>500){$('#fps').textContent=Math.round(fc*1000/(t-ft))+' FPS';fc=0;ft=t}
 if(state==='play'){if(locked)update(dt);cam.position.set(P.x,P.y+EYE,P.z);cam.rotation.set(P.pitch,P.yaw,0,'YXZ');stream(P.x,P.z);
  const r=locked?ray():null;hl.visible=!!r;if(r)hl.position.set(r.h[0]+.5,r.h[1]+.5,r.h[2]+.5)}
 else{ang+=dt*.06;cam.position.set(sp.x+Math.cos(ang)*34,sp.h+20,sp.z+Math.sin(ang)*34);cam.lookAt(sp.x,sp.h,sp.z);stream(sp.x,sp.z)}
 cl.position.set(cam.position.x,84,cam.position.z);ct.offset.x+=dt*.003;R.render(scene,cam)}
setSeed(seedNum('Multicraft-Menu'));applyGfx();preview();requestAnimationFrame(loop);
</script></body></html>
